name: family-expenses

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
      POSTGRES_DB: expenses
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://expenses:expenses@postgres:5432/expenses?sslmode=disable
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    # WEB_USER и WEB_PASSWORD включают пароль на панель, без них она открыта.
    env_file:
      - path: .env
        required: false
    # Наружу панель выходит только через туннель, сам порт открыт лишь на этой машине.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Публичная ссылка на панель через SSH-туннель localhost.run: без аккаунта, нужен только исходящий порт 22.
  # Запуск: docker compose --profile public up -d; адрес вида https://xxxx.lhr.life появится в логах tunnel.
  tunnel:
    image: alpine:3.22
    command: >-
      sh -c "apk add --no-cache openssh-client >/dev/null &&
      exec ssh -T -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes
      -R 80:web:80 nokey@localhost.run"
    depends_on:
      - web
    profiles: ["public"]
    restart: unless-stopped

volumes:
  pgdata:
